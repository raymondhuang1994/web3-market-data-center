name: Daily data update
on:
  schedule:
    # UTC: prepare twice before 09:00 Asia/Hong_Kong, every calendar day.
    - cron: '37 0 * * *'
    - cron: '52 0 * * *'
    # Finalize after cutoff and retry before the 10:00 publication target.
    - cron: '7 1 * * *'
    - cron: '32 1 * * *'
  push:
    branches: [main]
    paths: ['data/analysis/*.json', 'data/requests/*.json']
  workflow_dispatch:
    inputs:
      phase:
        description: 'Prepare data or generate analysis and publish the daily PDF'
        type: choice
        options: [collect, finalize]
        default: finalize
permissions:
  contents: read
concurrency:
  group: production-data-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'raymondhuang1994/web3-market-data-center' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.WEB3_RUNNER == 'mac' && fromJSON('["self-hosted","macOS","ARM64","web3-data-center"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select daily phase
        id: plan
        run: python3 scripts/workflow-plan.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.plan.outputs.phase == 'finalize'
        with:
          node-version: '24'
      - name: Collect free sources within the cutoff
        if: steps.plan.outputs.phase == 'collect'
        run: python3 scripts/collect.py
      - name: Stage validated data without changing the public edition
        if: steps.plan.outputs.phase == 'collect'
        run: python3 scripts/publish.py
      - name: Generate free BigModel analysis and freeze validated evidence
        if: steps.plan.outputs.phase == 'finalize'
        id: analysis
        run: python3 scripts/generate-analysis.py
      - name: Install locked report renderer
        if: steps.plan.outputs.phase == 'finalize' && steps.analysis.outputs.published != 'true'
        run: |
          npx --yes pnpm@11.19.0 --filter web3-report-renderer install --frozen-lockfile --ignore-scripts
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
            echo 'PDF_CHROMIUM_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
          else
            node tooling/pdf/node_modules/playwright/cli.js install --with-deps chromium
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Generate the complete report from the frozen edition
        if: steps.plan.outputs.phase == 'finalize' && steps.analysis.outputs.published != 'true'
        run: node scripts/render-report.mjs
      - name: Publish data, AI analysis and PDF together
        if: steps.plan.outputs.phase == 'finalize' && steps.analysis.outputs.published != 'true'
        run: python3 scripts/publish-report.py
