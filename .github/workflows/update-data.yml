name: Daily data update
on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Collect free public sources
        run: python3 scripts/collect.py
      - name: Validate and publish snapshot
        run: python3 scripts/publish.py
      - name: Install locked report renderer
        run: |
          npx --yes pnpm@11.19.0 --filter web3-report-renderer install --frozen-lockfile --ignore-scripts
          node tooling/pdf/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate the accepted snapshot report
        run: node scripts/render-report.mjs
      - name: Publish report for public download
        run: python3 scripts/publish-report.py
